name: Fortnightly outside-groups ingest

on:
  schedule:
    # 1st and 15th of each month, 13:00 UTC (~8-9am New York)
    - cron: "0 13 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl outside publishers and diff against what is summarized
        id: ingest
        continue-on-error: true
        run: python3 scripts/ingest_outside.py

      # Drafts summaries for reports on the worklist with the Claude API and
      # publishes only drafts that pass every check. Reports the model would
      # rule out are recorded as suggestions in data/outside_triage.json, never
      # ruled out automatically. Without the ANTHROPIC_API_KEY secret it does
      # nothing and exits 0.
      - name: Draft summaries for new outside reports (skipped without ANTHROPIC_API_KEY)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install --quiet "anthropic>=1.9,<2" "pypdf>=6"
          python3 scripts/draft_summaries.py --outside --max-cost 3

      - name: Rebuild the worklist after drafting
        id: worklist
        continue-on-error: true
        run: python3 scripts/ingest_outside.py --no-crawl

      - name: Verify every quote and number against its source
        run: python3 scripts/verify_summaries.py

      - name: Rebuild site data
        run: python3 scripts/build_site.py

      - name: Commit the crawl index, worklist and any new summaries
        run: |
          git config user.name "audit-files-bot"
          git config user.email "actions@github.com"
          for p in data/outside_index.json data/outside_new.md data/summaries data/raw_extra \
                   data/drafts data/outside_triage.json docs/audits.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          git diff --cached --quiet || git commit -m "Fortnightly outside crawl"
          git push

      - name: Open an issue listing the new reports
        if: always() && steps.worklist.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/outside_new.md ]; then
            gh issue create \
              --title "Outside reports to summarize ($(date +%Y-%m-%d))" \
              --body-file data/outside_new.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh issue create \
              --title "Outside ingest failed ($(date +%Y-%m-%d))" \
              --body "scripts/ingest_outside.py exited nonzero but wrote no worklist. A publisher's site has probably changed shape. Check the run log." \
              --repo "$GITHUB_REPOSITORY"
          fi
